<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sci-Fi Game Menu</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,Helvetica,sans-serif;
}

#menu{
    position:absolute;
    left:70px;
    top:50%;
    transform:translateY(-50%);
    color:white;
    z-index:10;
}

h1{
    font-size:60px;
    color:#6fd6ff;
    text-shadow:
    0 0 10px cyan,
    0 0 20px cyan,
    0 0 50px cyan;
}

button{
    display:block;
    width:260px;
    margin:20px 0;
    padding:18px;
    font-size:22px;
    color:#9fe8ff;
    background:rgba(0,100,160,.15);
    border:2px solid #44ddff;
    border-radius:8px;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateX(15px);
    background:rgba(0,170,255,.35);
    box-shadow:0 0 25px cyan;
}
</style>
</head>

<body>

<div id="menu">

<h1>SPARTAN</h1>

<button onclick="gotocampaign()">Campaign</button>
<button>Multiplayer</button>
<button>Forge</button>
<button>Settings</button>
<button>Exit</button>

</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.170.0/build/three.module.js";

const scene=new THREE.Scene();

scene.fog=new THREE.FogExp2(0x000814,.02);

const camera=new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
.1,
1000
);

camera.position.z=5;

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(innerWidth,innerHeight);

document.body.appendChild(renderer.domElement);

const stars=[];

const geo=new THREE.SphereGeometry(.05,6,6);

const mat=new THREE.MeshBasicMaterial({
color:0x99ddff
});

for(let i=0;i<1500;i++){

const s=new THREE.Mesh(geo,mat);

s.position.set(
(Math.random()-.5)*250,
(Math.random()-.5)*250,
(Math.random()-.5)*250
);

scene.add(s);

stars.push(s);

}

const ring=new THREE.TorusGeometry(
2,
.22,
32,
180
);

const ringMat=new THREE.MeshStandardMaterial({

color:0x00bfff,

metalness:1,

roughness:.15,

emissive:0x003366

});

const halo=new THREE.Mesh(ring,ringMat);

halo.rotation.x=Math.PI/2.5;

scene.add(halo);

const light=new THREE.PointLight(0x88ddff,60);

light.position.set(4,4,5);

scene.add(light);

const ambient=new THREE.AmbientLight(0x557799);

scene.add(ambient);

let mx=0;
let my=0;

window.addEventListener("mousemove",e=>{

mx=(e.clientX/window.innerWidth-.5)*.7;

my=(e.clientY/window.innerHeight-.5)*.5;

});

function animate(){

requestAnimationFrame(animate);

halo.rotation.z+=0.002;

camera.position.x+=(mx-camera.position.x)*.05;

camera.position.y+=(-my-camera.position.y)*.05;

renderer.render(scene,camera);

}

animate();

window.addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});
gotocampaign():
    window.document.href="https://vivaswgamer1.github.io/halowebsite/campaign


</script>

</body>
</html>
